version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bazarya
      POSTGRES_USER: bazarya
      POSTGRES_PASSWORD: bazarya
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bazarya
      SPRING_DATASOURCE_USERNAME: bazarya
      SPRING_DATASOURCE_PASSWORD: bazarya
    ports:
      - "8080:8080"
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
volumes:
  db_data:
