<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${category.seoTitle != null ? category.seoTitle : category.name}">Category</title>
    <meta name="description" th:content="${category.seoDescription}" />
    <link rel="canonical" th:href="@{'/c/' + ${category.slug}}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<nav class="nav">
    <div class="container nav__content">
        <a class="logo" href="/">Bazarya</a>
        <div class="nav__links">
            <a href="/services">Services</a>
            <a href="/booking/availability">Book Now</a>
            <a href="/products">Shop</a>
        </div>
        <a class="button button--ghost" href="/checkout">Checkout</a>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <span class="tag">Category</span>
        <h1 th:text="${category.name}">Category</h1>
        <p class="banner" th:text="${category.description}">Category description.</p>
    </div>

    <section class="section">
        <div class="section__title">
            <h2>Available Products</h2>
            <span class="tag" th:text="${#lists.size(products)} + ' items'"></span>
        </div>
        <div class="product-grid">
            <div class="product-card" th:each="product : ${products}">
                <h3 th:text="${product.name}">Product Name</h3>
                <p th:text="${product.shortDescription}">Short description</p>
                <a class="button button--primary" th:href="@{'/p/' + ${product.slug}}">View details</a>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p>Need help booking a service? Visit <a href="/booking/availability">Availability search</a> to reserve a slot.</p>
    </div>
</footer>
</body>
</html>
